<?xml version="1.0" encoding="UTF-8"?>
<!-- CARBON：兩張錯位的複寫單咬合。深色分頁時整體反轉，維持對比。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <style>
    .tile { fill: #1e4d3b; }
    .back { fill: #3fa878; }
    .front{ fill: #edf0ea; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #edf0ea; }
      .front{ fill: #1e4d3b; }
    }
  </style>
  <rect class="tile" width="16" height="16" rx="3"/>
  <path class="back" d="M1.5 3.5h9v10h-9V3.5Z"/>
  <path class="front" fill-rule="evenodd" d="M4.5 2h6l2.5 2.5V13h-8.5V2Zm2 4.5h4V5h-4v1.5Zm0 3h4V8h-4v1.5Zm0 2.5h3v-1.2h-3V12Z"/>
</svg>
